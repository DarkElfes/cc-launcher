[package]
name = "cc-launcher"
version = "0.10.0"
edition = "2024"
description = "Projects-first desktop launcher for Claude Code with per-account profiles"
license = "MIT"
publish = false

[[bin]]
name = "cc-launcher"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.11.0"
alacritty_terminal = "0.26.0"
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
getrandom = "0.3"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
self-replace = "1"
open = "5"
trash = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rust-embed = "8"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
