# Windows installer (NSIS) + auto-update metadata.
appId: dev.cclauncher.app
productName: cc-launcher
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# node-pty ships native binaries that can't be loaded from inside the asar archive.
asarUnpack:
  - '**/node_modules/@lydell/**'
win:
  icon: build/icon.png # generated from build/icon.svg by `pnpm icon`
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true # per-user install, no admin prompt; best fit for silent auto-updates
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: cc-launcher
  deleteAppDataOnUninstall: false # keeps the project list; Claude profiles live in ~/.claude-profiles anyway
# Where installed apps look for updates: releases of the PUBLIC GitHub repo below (no token needed).
# `pnpm release` (scripts/release.mjs) uploads them with the signed-in GitHub CLI.
publish:
  provider: github
  owner: DarkElfes
  repo: cc-launcher
  releaseType: release
